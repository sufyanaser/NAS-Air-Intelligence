[package]
name = "nas-air-desktop"
version = "0.3.0"
description = "NAS Air Intelligence desktop control center"
edition = "2021"
rust-version = "1.82"

[lib]
name = "nas_air_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
