[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nas-air-intelligence"
version = "0.1.0"
description = "Background radio stream monitoring and broadcast-intelligence pipeline for NAS FM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "NAS FM" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
ml = [
  "faster-whisper>=1.1.0",
  "av>=11,<19",
  "nvidia-cublas-cu12>=12.1.0; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.0.0; sys_platform == 'win32'",
]
ina = [
  "inaSpeechSegmenter>=0.8.0",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
nas-air = "nas_air_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_air_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
